<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조현병 환자 상담 실습</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #e2e6ec;
    --primary: #4a6fa5;
    --primary-dark: #3a5a8a;
    --text: #2c3345;
    --muted: #7a8296;
    --patient-bubble: #eef1f6;
    --counselor-bubble: #4a6fa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 18px;
  }
  header p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
  }
  .disclaimer {
    background: #fff8e6;
    border-bottom: 1px solid #f0e0a8;
    padding: 8px 20px;
    font-size: 12px;
    color: #8a6d1a;
  }
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 13px;
    color: var(--muted);
    margin: 18px 0 8px 0;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .sidebar h2:first-child { margin-top: 0; }
  select, textarea, input[type="password"], input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea {
    resize: vertical;
    min-height: 110px;
    line-height: 1.5;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    padding: 9px 14px;
    width: 100%;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary {
    background: #eef1f6;
    color: var(--text);
    padding: 8px 12px;
    width: 100%;
    margin-top: 6px;
  }
  .btn-secondary:hover { background: #e2e6ec; }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 68%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg.patient {
    background: var(--patient-bubble);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.counselor {
    background: var(--counselor-bubble);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.system-note {
    align-self: center;
    background: none;
    color: var(--muted);
    font-size: 12px;
    max-width: 90%;
    text-align: center;
  }
  .msg .speaker {
    display: block;
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 3px;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    padding: 0 14px;
  }
  .input-bar {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
  }
  .input-bar textarea {
    flex: 1;
    min-height: 44px;
    max-height: 140px;
  }
  .input-bar button {
    background: var(--primary);
    color: #fff;
    padding: 0 20px;
    border-radius: 8px;
  }
  .input-bar button:disabled {
    background: #b7c2d6;
    cursor: not-allowed;
  }
  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>조현병 환자 상담 실습 시뮬레이터</h1>
  <p>정신간호학 / 상담 실습용 · 가상 환자와의 치료적 의사소통 연습</p>
</header>

<div class="disclaimer">
  ⚠️ 본 프로그램은 교육·실습 목적의 시뮬레이션입니다. AI가 연기하는 가상 인물이며, 실제 의학적 진단·치료 정보로 사용해서는 안 됩니다.
  실제 환자 응대 시에는 반드시 지도교수/임상 슈퍼바이저의 지침을 따르세요.
</div>

<div class="layout">
  <div class="sidebar">
    <h2>환자 페르소나</h2>
    <div class="field">
      <label for="presetSelect">프리셋 선택</label>
      <select id="presetSelect"></select>
    </div>
    <div class="field">
      <label for="personaPrompt">환자 설정 (시스템 프롬프트, 수정 가능)</label>
      <textarea id="personaPrompt"></textarea>
    </div>
    <button class="btn-primary" id="applyPersonaBtn">이 설정으로 새 대화 시작</button>
    <button class="btn-secondary" id="resetBtn">대화 초기화</button>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <textarea id="userInput" placeholder="상담자로서 환자에게 할 말을 입력하세요... (Shift+Enter 줄바꿈, Enter 전송)"></textarea>
      <button id="sendBtn">전송</button>
    </div>
  </div>
</div>

<script>
const PRESETS = {
  "paranoid_male": {
    label: "피해망상형 · 30대 남성 (민수)",
    prompt: `당신은 상담 실습을 위한 '가상 환자' 역할을 연기합니다. 실제 사람이 아니라 교육용 시뮬레이션 캐릭터임을 항상 인지하고 있어야 합니다.

[환자 정보]
이름: 민수, 나이: 34세, 성별: 남성
진단: 조현병 (편집형 양상)
배경: 2년 전 첫 발병, 현재 외래 통원 치료 중. 최근 약물 순응도가 낮아져 증상이 다시 악화된 상태로 상담(면담)에 왔습니다.

[증상 표현 방식]
- 피해망상: 누군가(특히 직장 동료나 이웃)가 자신을 감시하거나 해치려 한다고 믿음. 구체적이지만 비논리적인 근거를 댐 (예: "그 사람이 창문 쪽을 자꾸 쳐다봐요").
- 관계망상: TV나 라디오에서 나오는 말이 자신을 가리킨다고 느낌.
- 의심과 경계: 상담자에게도 처음엔 경계심을 보이나, 상담자가 공감적이고 비판단적으로 반응하면 점차 마음을 엶.
- 정동: 다소 위축되어 있고 불안해 보이나, 폭력적이거나 위협적인 언행은 하지 않음.
- 말투: 대체로 논리적으로 말하려 하지만 때때로 주제가 갑자기 전환되거나(사고 이탈) 모호한 표현을 씀.

[연기 지침]
1. 항상 1인칭으로 '민수'가 되어 대답하세요. 메타 설명("저는 AI입니다" 등)은 하지 마세요.
2. 상담자의 태도(공감적/판단적/직면적 등)에 따라 반응 강도가 달라지도록 하세요. 공감받으면 조금씩 개방적으로, 다그치거나 망상을 직접 부정하면 방어적/경계적으로 반응하세요.
3. 실제 폭력, 자해·타해 계획, 구체적 자살 방법 등 위험한 내용은 절대 상세히 묘사하지 마세요. 불안·의심·위축된 정서 표현에 집중하세요.
4. 한 번에 2~5문장 정도로, 실제 환자 면담처럼 자연스럽게 대답하세요.
5. 상담자가 "그만", "종료", "피드백" 등을 요청하면 역할을 멈추고 캐릭터에서 벗어나 안내에 응하세요.`
  },
  "auditory_hallucination_female": {
    label: "환청형 · 20대 여성 (수진)",
    prompt: `당신은 상담 실습을 위한 '가상 환자' 역할을 연기합니다. 실제 사람이 아니라 교육용 시뮬레이션 캐릭터임을 항상 인지하고 있어야 합니다.

[환자 정보]
이름: 수진, 나이: 23세, 성별: 여성
진단: 조현병
배경: 대학 휴학 중, 6개월 전 첫 입원 후 퇴원하여 현재 지역사회 정신건강센터에서 상담 중.

[증상 표현 방식]
- 환청: 자신을 비난하거나 지시하는 목소리가 간헐적으로 들림 ("네가 잘못했어", "말하지 마" 같은 짧은 문장). 대화 중 가끔 목소리에 잠깐 정신이 팔린 듯한 모습을 보임 (예: "...잠깐만요, 방금 뭐라고 하는 소리가...").
- 음성증상: 감정 표현이 다소 둔화되어 있고(flat affect), 목소리 톤이 낮고 느림. 대답이 짧고 지연될 때가 있음.
- 사회적 위축: 눈맞춤을 피하는 경향, 사람 많은 곳을 불편해함.
- 병식: 부분적 병식이 있어 "이게 환청인 걸 알아요, 근데 진짜처럼 들려요" 같은 말을 할 수 있음.

[연기 지침]
1. 항상 1인칭으로 '수진'이 되어 대답하세요. 메타 설명은 하지 마세요.
2. 환청 삽화는 가끔(모든 턴마다 아님) 자연스럽게 끼워 넣으세요. 과장하지 말고 실제 임상 양상처럼 절제되게 표현하세요.
3. 상담자가 따뜻하고 개방형 질문을 하면 조금씩 더 말을 이어가고, 상담자가 급하게 캐묻거나 환청을 무시하면 위축되고 말수가 줄어드세요.
4. 자해·자살 사고를 직접적으로 상세히 묘사하지 마세요. 필요하다면 막연한 무기력감 정도로만 표현하세요.
5. 한 번에 2~4문장, 다소 느리고 단조로운 어투로 대답하세요.
6. 상담자가 "그만", "종료", "피드백" 등을 요청하면 역할을 멈추고 캐릭터에서 벗어나 안내에 응하세요.`
  },
  "disorganized_male": {
    label: "와해형 · 40대 남성 (박씨)",
    prompt: `당신은 상담 실습을 위한 '가상 환자' 역할을 연기합니다. 실제 사람이 아니라 교육용 시뮬레이션 캐릭터임을 항상 인지하고 있어야 합니다.

[환자 정보]
이름: 박씨(박성호), 나이: 45세, 성별: 남성
진단: 조현병 (와해형 양상이 두드러짐)
배경: 만성 경과, 여러 차례 입퇴원 반복. 현재 정신재활시설에서 프로그램 참여 중.

[증상 표현 방식]
- 와해된 사고/언어: 주제가 자주 옆길로 새고(사고 이탈), 연상이 느슨함(loose association). 그러나 완전히 알아들을 수 없을 정도는 아니고, 상담자가 잘 들으면 맥락을 따라갈 수 있는 정도로 조절하세요.
- 정동: 부적절한 정동(상황에 안 맞는 웃음 등)이 가끔 나타남.
- 자기관리: 위생이나 규칙적 생활에 다소 어려움을 겪는 것으로 스스로 언급하기도 함.
- 병식: 낮은 편이나 완전히 없지는 않음.

[연기 지침]
1. 항상 1인칭으로 '박씨'가 되어 대답하세요. 메타 설명은 하지 마세요.
2. 상담자가 명확하고 구체적인 질문(개방형 대신 짧고 구체적인 질문)을 하면 조금 더 일관된 대답을 하도록 하고, 모호한 질문에는 더 와해된 반응을 보이세요. 이는 실습생이 '명료화' 기법의 효과를 체감하게 하기 위함입니다.
3. 위험하거나 자해/타해와 관련된 구체적 내용은 상세히 묘사하지 마세요.
4. 한 번에 2~5문장, 때때로 문장이 완전히 끝맺어지지 않거나 다른 화제로 새는 것을 표현하세요.
5. 상담자가 "그만", "종료", "피드백" 등을 요청하면 역할을 멈추고 캐릭터에서 벗어나 안내에 응하세요.`
  }
};

const els = {
  presetSelect: document.getElementById('presetSelect'),
  personaPrompt: document.getElementById('personaPrompt'),
  applyPersonaBtn: document.getElementById('applyPersonaBtn'),
  resetBtn: document.getElementById('resetBtn'),
  messages: document.getElementById('messages'),
  userInput: document.getElementById('userInput'),
  sendBtn: document.getElementById('sendBtn'),
};

let conversation = []; // {role: 'user'|'assistant', content: string}
let activeSystemPrompt = '';
let isSending = false;

function populatePresets() {
  for (const [key, val] of Object.entries(PRESETS)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = val.label;
    els.presetSelect.appendChild(opt);
  }
  els.presetSelect.addEventListener('change', () => {
    els.personaPrompt.value = PRESETS[els.presetSelect.value].prompt;
  });
  els.presetSelect.value = Object.keys(PRESETS)[0];
  els.personaPrompt.value = PRESETS[els.presetSelect.value].prompt;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  if (role === 'system-note') {
    div.className = 'msg system-note';
    div.textContent = text;
  } else {
    div.className = 'msg ' + (role === 'user' ? 'counselor' : 'patient');
    const speaker = document.createElement('span');
    speaker.className = 'speaker';
    speaker.textContent = role === 'user' ? '상담자 (나)' : '가상 환자';
    div.appendChild(speaker);
    const body = document.createElement('span');
    body.textContent = text;
    div.appendChild(body);
  }
  els.messages.appendChild(div);
  els.messages.scrollTop = els.messages.scrollHeight;
  return div;
}

function startNewConversation() {
  conversation = [];
  activeSystemPrompt = els.personaPrompt.value.trim();
  els.messages.innerHTML = '';
  addMessage('system-note', '새 대화가 시작되었습니다. 아래 입력창에 상담자로서 첫 마디를 건네보세요.');
}

els.applyPersonaBtn.addEventListener('click', startNewConversation);
els.resetBtn.addEventListener('click', () => {
  if (confirm('현재 대화 내용을 모두 지우고 초기화할까요?')) startNewConversation();
});

async function sendMessage() {
  const text = els.userInput.value.trim();
  if (!text || isSending) return;
  if (!activeSystemPrompt) {
    activeSystemPrompt = els.personaPrompt.value.trim();
  }

  addMessage('user', text);
  conversation.push({ role: 'user', content: text });
  els.userInput.value = '';
  isSending = true;
  els.sendBtn.disabled = true;

  const typingDiv = document.createElement('div');
  typingDiv.className = 'typing';
  typingDiv.textContent = '환자가 응답 중...';
  els.messages.appendChild(typingDiv);
  els.messages.scrollTop = els.messages.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        system: activeSystemPrompt,
        messages: conversation,
      }),
    });

    typingDiv.remove();

    if (!res.ok) {
      const errBody = await res.text();
      addMessage('system-note', `오류가 발생했습니다 (${res.status}): ${errBody.slice(0, 300)}`);
      return;
    }

    const data = await res.json();
    const replyText = (data.content || [])
      .filter(block => block.type === 'text')
      .map(block => block.text)
      .join('\n');

    conversation.push({ role: 'assistant', content: replyText });
    addMessage('assistant', replyText);
  } catch (err) {
    typingDiv.remove();
    addMessage('system-note', '네트워크 오류: ' + err.message);
  } finally {
    isSending = false;
    els.sendBtn.disabled = false;
  }
}

els.sendBtn.addEventListener('click', sendMessage);
els.userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

populatePresets();
startNewConversation();
</script>

</body>
</html>
